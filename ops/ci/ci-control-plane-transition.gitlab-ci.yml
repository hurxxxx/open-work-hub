stages:
  - scope
  - policy
  - validate

bootstrap_scope:
  stage: scope
  image: ai-do-validation:node25-python312-v1-0cc601d5a5d5
  tags:
    - ai-do-validation
  inherit:
    default: false
    variables: false
  dependencies: []
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
  before_script: []
  script:
    - |
      expected_transition_sha="__TRANSITION_SOURCE_SHA__"
      expected_target_sha="43851164544b1ccedb28314710402052c2fe542d"
      test "$CI_PROJECT_ID" = "1"
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        test "$CI_MERGE_REQUEST_IID" = "277"
        test "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" = "$CI_PROJECT_ID"
        test "$CI_MERGE_REQUEST_PROJECT_ID" = "$CI_PROJECT_ID"
        test "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" = "fix/ci-final-contract-transition"
        test "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "dev"
        test "$CI_MERGE_REQUEST_DIFF_BASE_SHA" = "$expected_target_sha"
        test "$CI_COMMIT_SHA" = "$expected_transition_sha"
      else
        test "$CI_COMMIT_BRANCH" = "dev"
        git merge-base --is-ancestor "$expected_target_sha" "$CI_COMMIT_SHA"
        git merge-base --is-ancestor "$expected_transition_sha" "$CI_COMMIT_SHA"
      fi
  after_script: []

mr_target_policy:
  stage: policy
  image: ai-do-validation:node25-python312-v1-0cc601d5a5d5
  tags:
    - ai-do-validation
  inherit:
    default: false
    variables: false
  needs:
    - bootstrap_scope
  dependencies: []
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script: []
  script:
    - node scripts/check-mr-target-policy.mjs
    - node scripts/check-feature-mr-preflight-receipt.mjs
  after_script: []

ci_control_plane_transition:
  stage: validate
  image: ai-do-validation:node25-python312-v1-0cc601d5a5d5
  tags:
    - ai-do-validation
  inherit:
    default: false
    variables: false
  needs:
    - bootstrap_scope
  dependencies: []
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
  before_script: []
  script:
    - if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then git diff --check "$CI_MERGE_REQUEST_DIFF_BASE_SHA...$CI_COMMIT_SHA"; else git diff --check "__TRANSITION_SOURCE_SHA__^...$CI_COMMIT_SHA"; fi
    - bash -n scripts/codex-review-ci.sh
    - bash -n scripts/configure-ci-validation-env.sh
    - bash -n scripts/install-ci-validation-runner.sh
    - bash -n scripts/promote-ci-control-plane.sh
    - test "$(sha256sum ops/ci/validation-runner/Dockerfile | awk '{print $1}')" = "9380fbe27931153e443264e714c67c46a1b89700b889a22e2ad5a422f0cf1593"
    - uv pip install --system --no-cache PyYAML==6.0.3
    - bash scripts/codex-review-ci.sh --validate-gitlab-ci-contract .gitlab-ci.yml
    - bash scripts/codex-review-ci.sh --validate-gitlab-ci-contract ops/ci/ci-first.gitlab-ci.yml
    - bash scripts/configure-ci-validation-env.sh --validate-only
    - uv run --python 3.12 python -m unittest scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_runtime_requires_core_and_affected_validation_jobs scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_runtime_uses_target_evidence_and_isolates_source_instructions scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_runtime_requires_integration_fitness_without_prompt_command_substitution scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_installer_only_uses_clean_current_origin_dev scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_runner_and_control_plane_installers_enforce_clean_dev_rollout scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_ci_postgres_contract_validates_without_mutating_host scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_current_gitlab_ci_matches_runner_owned_contract scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_planned_ci_first_config_matches_compatibility_contract scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_gitlab_ci_contract_rejects_integration_service_substitution scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_gitlab_ci_contract_requires_mr_and_dev_api_regression_rules scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_gitlab_ci_contract_ignores_source_checkout_python_modules scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_gitlab_ci_contract_rejects_validation_job_bypasses scripts.tests.test_check_codex_review_ci.CodexReviewContractTests.test_gitlab_ci_contract_rejects_root_and_publish_job_bypasses
  after_script: []
