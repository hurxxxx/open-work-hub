server {
    listen 80;
    listen [::]:80;
    server_name dwdcc.kr www.dwdcc.kr ext.dwdcc.kr drawio.dwdcc.kr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name drawio.dwdcc.kr;

    ssl_certificate /etc/lego/production/certificates/dwdcc.kr.crt;
    ssl_certificate_key /etc/lego/production/certificates/dwdcc.kr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1025m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors https://dwdcc.kr https://www.dwdcc.kr https://ext.dwdcc.kr" always;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name dwdcc.kr www.dwdcc.kr ext.dwdcc.kr;

    ssl_certificate /etc/lego/production/certificates/dwdcc.kr.crt;
    ssl_certificate_key /etc/lego/production/certificates/dwdcc.kr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1025m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /drawio {
        return 308 https://drawio.dwdcc.kr/;
    }

    location /drawio/ {
        rewrite ^/drawio/(.*)$ https://drawio.dwdcc.kr/$1 permanent;
    }

    location ^~ /inference-gateway/ {
        return 404;
    }

    location ~ ^/api/v1/workspaces/[^/]+/(docs|whiteboard)/collab/.*/ws(?:/.*)?$ {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
