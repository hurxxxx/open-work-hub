name: open-work-hub-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: open-work-hub-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OPEN_WORK_HUB_INFRA_POSTGRES_DB:-open_work_hub_dev}
      POSTGRES_PASSWORD: ${OPEN_WORK_HUB_INFRA_POSTGRES_PASSWORD:-open_work_hub_dev}
      POSTGRES_USER: ${OPEN_WORK_HUB_INFRA_POSTGRES_USER:-open_work_hub_dev}
    ports:
      - "127.0.0.1:${OPEN_WORK_HUB_INFRA_POSTGRES_PORT:-55433}:5432"
    volumes:
      - open-work-hub-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - open-work-hub-dev-infra

  redis:
    image: redis:7
    container_name: open-work-hub-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_REDIS_PORT:-56380}:6379"
    volumes:
      - open-work-hub-dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - open-work-hub-dev-infra

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: open-work-hub-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OPEN_WORK_HUB_INFRA_MINIO_ROOT_USER:-open_work_hub_dev_minio}
      MINIO_ROOT_PASSWORD: ${OPEN_WORK_HUB_INFRA_MINIO_ROOT_PASSWORD:-open_work_hub_dev_minio}
    command: server /data --console-address :9001
    ports:
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_MINIO_PORT:-59010}:9000"
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_MINIO_CONSOLE_PORT:-59011}:9001"
    volumes:
      - open-work-hub-dev-minio-data:/data
    networks:
      - open-work-hub-dev-infra

  opensearch:
    build:
      context: ../..
      dockerfile: ops/opensearch/Dockerfile
    image: open-work-hub-opensearch:3.3.2-nori
    container_name: open-work-hub-dev-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_OPENSEARCH_PORT:-59210}:9200"
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_OPENSEARCH_PERF_PORT:-59610}:9600"
    volumes:
      - open-work-hub-dev-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - open-work-hub-dev-infra

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: open-work-hub-dev-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${OPEN_WORK_HUB_INFRA_QDRANT_API_KEY:-open_work_hub_dev_qdrant}
    ports:
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_QDRANT_PORT:-16333}:6333"
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - open-work-hub-dev-qdrant-data:/qdrant/storage
    networks:
      - open-work-hub-dev-infra

  livekit:
    image: livekit/livekit-server:latest
    container_name: open-work-hub-dev-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${OPEN_WORK_HUB_LIVEKIT_RTC_TCP_PORT:-7881}
          port_range_start: ${OPEN_WORK_HUB_LIVEKIT_RTC_PORT_RANGE_START:-52000}
          port_range_end: ${OPEN_WORK_HUB_LIVEKIT_RTC_PORT_RANGE_END:-52100}
          use_external_ip: false
        keys:
          ${OPEN_WORK_HUB_LIVEKIT_API_KEY:-devkey}: ${OPEN_WORK_HUB_LIVEKIT_API_SECRET:-devsecret}
    ports:
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_LIVEKIT_PORT:-7880}:7880"
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_LIVEKIT_RTC_TCP_PORT:-7881}:${OPEN_WORK_HUB_LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_LIVEKIT_RTC_PORT_RANGE_START:-52000}-${OPEN_WORK_HUB_LIVEKIT_RTC_PORT_RANGE_END:-52100}:${OPEN_WORK_HUB_LIVEKIT_RTC_PORT_RANGE_START:-52000}-${OPEN_WORK_HUB_LIVEKIT_RTC_PORT_RANGE_END:-52100}/udp"
    networks:
      - open-work-hub-dev-infra

  drawio:
    image: jgraph/drawio:${OPEN_WORK_HUB_DRAWIO_IMAGE_TAG:-30.2.5}
    container_name: open-work-hub-dev-drawio
    restart: unless-stopped
    ports:
      - "${OPEN_WORK_HUB_DRAWIO_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_DRAWIO_PORT:-18082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - open-work-hub-dev-infra

  bento:
    build:
      context: ../..
      dockerfile: ops/bento/Dockerfile
    image: open-work-hub-bento:${OPEN_WORK_HUB_BENTO_IMAGE_TAG:-1.0.17}
    container_name: open-work-hub-dev-bento
    restart: unless-stopped
    ports:
      - "${OPEN_WORK_HUB_BENTO_BIND_HOST:-127.0.0.1}:${OPEN_WORK_HUB_BENTO_PORT:-18084}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - open-work-hub-dev-infra

  hermes-bootstrap:
    image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
    container_name: open-work-hub-dev-hermes-bootstrap
    network_mode: host
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,mode=0755
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    environment:
      API_SERVER_KEY: ${OPEN_WORK_HUB_HERMES_API_KEY:-}
      HERMES_GATEWAY_NO_SUPERVISE: "1"
      HERMES_GID: "10000"
      HERMES_UID: "10000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command:
      - /bin/sh
      - -ec
      - >-
        /opt/hermes/.venv/bin/python /opt/open-work-hub-hermes/bootstrap.py &&
        /opt/hermes/.venv/bin/hermes gateway stop
    volumes:
      - open-work-hub-dev-hermes-data:/opt/data
      - ../hermes/bootstrap.py:/opt/open-work-hub-hermes/bootstrap.py:ro

  hermes-gateway:
    image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
    container_name: open-work-hub-dev-hermes-gateway
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,mode=0755
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    depends_on:
      hermes-bootstrap:
        condition: service_completed_successfully
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_KEY: ${OPEN_WORK_HUB_HERMES_API_KEY:-}
      API_SERVER_PORT: ${OPEN_WORK_HUB_HERMES_RUNTIME_PORT:-18642}
      GATEWAY_MULTIPLEX_PROFILES: "true"
      HERMES_GATEWAY_NO_SUPERVISE: "1"
      HERMES_GID: "10000"
      HERMES_MODEL: qwen/qwen3.8-flash
      HERMES_UID: "10000"
    command:
      - /opt/hermes/.venv/bin/python
      - /opt/open-work-hub-hermes/gateway_entry.py
      - gateway
      - run
      - --no-supervise
    volumes:
      - open-work-hub-dev-hermes-data:/opt/data
      - ../hermes/gateway_entry.py:/opt/open-work-hub-hermes/gateway_entry.py:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          -H "Authorization: Bearer $${API_SERVER_KEY}"
          "http://127.0.0.1:$${API_SERVER_PORT}/health/detailed" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  hermes-dashboard:
    image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
    container_name: open-work-hub-dev-hermes-dashboard
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,mode=0755
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    depends_on:
      hermes-gateway:
        condition: service_healthy
    environment:
      GATEWAY_MULTIPLEX_PROFILES: "true"
      HERMES_DASHBOARD_SESSION_TOKEN: ${OPEN_WORK_HUB_HERMES_MANAGEMENT_TOKEN:-}
      HERMES_GID: "10000"
      HERMES_UID: "10000"
    command:
      - dashboard
      - --host
      - 127.0.0.1
      - --port
      - ${OPEN_WORK_HUB_HERMES_MANAGEMENT_PORT:-19119}
      - --no-open
    volumes:
      - open-work-hub-dev-hermes-data:/opt/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          "http://127.0.0.1:${OPEN_WORK_HUB_HERMES_MANAGEMENT_PORT:-19119}/api/health"
          >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  hermes-terminal-egress-client-init:
    image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
    container_name: open-work-hub-dev-hermes-terminal-egress-client-init
    user: "0:0"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        chown 0:0 /client
        chmod 0700 /client
        chown 10000:10000 /client
    volumes:
      - open-work-hub-dev-hermes-terminal-egress-client:/client
    network_mode: none

  hermes-terminal-egress:
    image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
    container_name: open-work-hub-dev-hermes-terminal-egress
    restart: unless-stopped
    depends_on:
      hermes-terminal-egress-client-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,mode=0755
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    environment:
      HERMES_GID: "10000"
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OWH_HERMES_TERMINAL_EGRESS_CLIENT_DIR: /opt/data/home/egress-client
    command:
      - /opt/hermes/.venv/bin/python
      - /opt/open-work-hub-hermes/terminal_egress.py
    volumes:
      - open-work-hub-dev-hermes-terminal-egress-data:/opt/data
      - open-work-hub-dev-hermes-terminal-egress-client:/opt/data/home/egress-client
      - ../hermes/terminal_egress.py:/opt/open-work-hub-hermes/terminal_egress.py:ro
    healthcheck:
      test:
        - CMD
        - /opt/hermes/.venv/bin/python
        - -c
        - >-
          import pathlib,socket;
          assert pathlib.Path('/opt/data/home/egress-client/openrouter.token').is_file();
          s=socket.create_connection(('127.0.0.1',19090),3);s.close()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      open-work-hub-hermes-terminal-sandbox:
        aliases:
          - hermes-terminal-egress
      open-work-hub-dev-infra: {}

  hermes-terminal-broker:
    build:
      context: ../..
      dockerfile: ops/hermes-terminal-broker/Dockerfile
    image: open-work-hub-hermes-terminal-broker:dev
    container_name: open-work-hub-dev-hermes-terminal-broker
    restart: unless-stopped
    depends_on:
      hermes-terminal-egress:
        condition: service_healthy
    environment:
      OPEN_WORK_HUB_HERMES_MCP_SHARED_SECRET: ${OPEN_WORK_HUB_HERMES_MCP_SHARED_SECRET:-}
      OWH_HERMES_TERMINAL_BROKER_INSTANCE_ID: dev-broker
      OWH_HERMES_TERMINAL_EGRESS_CLIENT_DIR: /run/owh-hermes-terminal-egress
      OWH_HERMES_TERMINAL_EGRESS_CLIENT_VOLUME: open-work-hub-dev-hermes-terminal-egress-client
      OWH_HERMES_TERMINAL_IMAGE: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
      OWH_HERMES_TERMINAL_MCP_RELAY_BASE_URL: http://hermes-terminal-broker:18765/mcp
      OWH_HERMES_TERMINAL_MCP_SOCKET_PATH: /run/open-work-hub/hermes-terminal-mcp.sock
      OWH_HERMES_TERMINAL_PROFILE_ARCHIVE_MAX_BYTES: ${OPEN_WORK_HUB_HERMES_TERMINAL_PROFILE_ARCHIVE_MAX_BYTES:-67108864}
      OWH_HERMES_TERMINAL_SANDBOX_NETWORK: open-work-hub-dev-hermes-terminal-sandbox
      OWH_HERMES_TERMINAL_WORKSPACE_ARCHIVE_MAX_BYTES: ${OPEN_WORK_HUB_HERMES_TERMINAL_WORKSPACE_ARCHIVE_MAX_BYTES:-268435456}
    ports:
      - "127.0.0.1:${OPEN_WORK_HUB_HERMES_TERMINAL_BROKER_PORT:-18765}:18765"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../.runtime:/run/open-work-hub
      - open-work-hub-dev-hermes-terminal-egress-client:/run/owh-hermes-terminal-egress:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          body=json.load(urllib.request.urlopen('http://127.0.0.1:18765/healthz',timeout=5));
          assert body.get('ready') is True
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      open-work-hub-hermes-terminal-sandbox:
        aliases:
          - hermes-terminal-broker
      open-work-hub-dev-infra: {}

  nginx:
    image: nginx:1.27-alpine
    container_name: open-work-hub-dev-nginx
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      drawio:
        condition: service_healthy
    ports:
      - "${OPEN_WORK_HUB_INFRA_BIND_HOST:-0.0.0.0}:${OPEN_WORK_HUB_INFRA_NGINX_PORT:-4200}:80"
    extra_hosts:
      - "dev-host:host-gateway"
    volumes:
      - ../../dist/apps/web:/usr/share/nginx/html:ro
      - ${OPEN_WORK_HUB_DEV_NGINX_CONF_PATH:-../../ops/dev/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - open-work-hub-dev-infra

networks:
  open-work-hub-dev-infra:
    name: open-work-hub-dev-infra
  open-work-hub-hermes-terminal-sandbox:
    name: open-work-hub-dev-hermes-terminal-sandbox
    internal: true

volumes:
  open-work-hub-dev-postgres-data:
    name: open-work-hub-dev-postgres-data
  open-work-hub-dev-redis-data:
    name: open-work-hub-dev-redis-data
  open-work-hub-dev-minio-data:
    name: open-work-hub-dev-minio-data
  open-work-hub-dev-opensearch-data:
    name: open-work-hub-dev-opensearch-data
  open-work-hub-dev-qdrant-data:
    name: open-work-hub-dev-qdrant-data
  open-work-hub-dev-hermes-data:
    name: open-work-hub-dev-hermes-data
  open-work-hub-dev-hermes-terminal-egress-data:
    name: open-work-hub-dev-hermes-terminal-egress-data
  open-work-hub-dev-hermes-terminal-egress-client:
    name: open-work-hub-dev-hermes-terminal-egress-client
