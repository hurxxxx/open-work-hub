name: open-work-hub-matomo

services:
  db:
    image: ${MATOMO_DB_IMAGE:-mariadb:11}
    container_name: open-work-hub-matomo-db
    restart: unless-stopped
    command: ["--max-allowed-packet=64MB"]
    environment:
      MARIADB_DATABASE: ${MATOMO_DATABASE_DBNAME:-matomo}
      MARIADB_USER: ${MATOMO_DATABASE_USERNAME:-matomo}
      MARIADB_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?MATOMO_DATABASE_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DATABASE_ROOT_PASSWORD:?MATOMO_DATABASE_ROOT_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
    volumes:
      - open-work-hub-matomo-db-data:/var/lib/mysql

  matomo:
    image: ${MATOMO_IMAGE:-matomo:5-apache}
    container_name: open-work-hub-matomo
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${MATOMO_HTTP_PORT:-18084}:80"
    environment:
      MATOMO_DATABASE_HOST: db
      MATOMO_DATABASE_ADAPTER: mysqli
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MATOMO_DATABASE_USERNAME:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?MATOMO_DATABASE_PASSWORD is required}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DATABASE_DBNAME:-matomo}
      PHP_MEMORY_LIMIT: ${MATOMO_PHP_MEMORY_LIMIT:-512M}
    volumes:
      - open-work-hub-matomo-app-data:/var/www/html

  cron:
    image: ${MATOMO_IMAGE:-matomo:5-apache}
    container_name: open-work-hub-matomo-cron
    restart: unless-stopped
    depends_on:
      - db
      - matomo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php /var/www/html/console core:archive --url="$${MATOMO_PUBLIC_URL}" --no-ansi --no-interaction || true
          sleep "$${MATOMO_ARCHIVE_INTERVAL_SECONDS:-300}"
        done
    environment:
      MATOMO_PUBLIC_URL: ${MATOMO_PUBLIC_URL:-https://matomo.open-work-hub.example/}
      MATOMO_ARCHIVE_INTERVAL_SECONDS: ${MATOMO_ARCHIVE_INTERVAL_SECONDS:-300}
      PHP_MEMORY_LIMIT: ${MATOMO_PHP_MEMORY_LIMIT:-512M}
    volumes:
      - open-work-hub-matomo-app-data:/var/www/html

volumes:
  open-work-hub-matomo-db-data:
    name: open-work-hub-matomo-db-data
  open-work-hub-matomo-app-data:
    name: open-work-hub-matomo-app-data
