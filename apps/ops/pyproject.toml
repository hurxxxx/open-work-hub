[project]
name = "open-alm-ops"
version = "0.1.1"
description = "Operational tooling scaffold for Open ALM, Open ALM's AI work portal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-settings>=2.8.0,<3.0.0"
]

[dependency-groups]
dev = [
  "ruff>=0.11.0,<0.12.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/open_alm_ops"]
