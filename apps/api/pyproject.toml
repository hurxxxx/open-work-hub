[project]
name = "open-work-hub-api"
version = "0.1.1"
description = "FastAPI API for Open Work Hub."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "python-dotenv>=1.2.0,<2.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "alembic>=1.16.0,<2.0.0",
  "celery>=5.5.0,<6.0.0",
  "redis>=5.2.0,<6.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "minio>=7.2.0,<8.0.0",
  "httpx>=0.28.0,<0.29.0",
  "openai>=2.0.0,<3.0.0",
  "anthropic>=0.52.0,<1.0.0",
  "google-auth[requests]>=2.30.0,<3.0.0",
  "google-genai>=1.0.0,<2.0.0",
  "opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3",
  "cryptography>=44.0.0,<48.0.0",
  "opentelemetry-api>=1.32.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.32.0,<2.0.0",
  "opentelemetry-sdk>=1.32.0,<2.0.0",
  "python-multipart>=0.0.18,<1.0.0",
  "sse-starlette>=2.1,<3.0",
  "y-py>=0.6.2",
  "ypy-websocket>=0.12.4",
  "opentelemetry-exporter-otlp-proto-grpc>=1.32.0,<2.0.0",
  "qdrant-client==1.17.1",
  "openai-agents>=0.3.0,<1.0.0",
  "olefile>=0.47,<1.0",
  "openpyxl>=3.1.0,<4.0",
  "numpy>=1.26,<3.0",
  "pillow>=10.0.0,<12.0.0",
  "pymupdf>=1.24.0,<2.0",
  "pdfplumber>=0.11.0,<1.0",
  "python-docx>=1.1.0,<2.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
]

[dependency-groups]
dev = [
  "import-linter>=2.11",
  "pytest>=8.3.0,<9.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "ruff>=0.11.0,<0.12.0",
]

[project.optional-dependencies]
rag-local = [
  "sentence-transformers>=3.3.0",
  "torch>=2.4.0",
  "transformers>=4.45.0",
  "docling>=2.0.0",
  "easyocr>=1.7.0",
]
asr-local = [
  "faster-whisper>=1.1.0,<2.0.0",
]
privacy-filter = [
  "opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "slow: high-cost integration or provider smoke tests excluded from the default API suite",
  "external_integration: tests that require shared non-production Redis, MinIO, or OpenSearch infrastructure",
  "migration: native PostgreSQL migration contracts run only for migration or model changes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/open_work_hub_api"]
