[project]
name = "open-work-hub-api"
version = "0.1.1"
description = "FastAPI API for Open Work Hub."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<0.142.0",
  "python-dotenv>=1.2.3,<2.0.0",
  "uvicorn[standard]>=0.52.4,<0.53.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "sqlalchemy>=2.0.52,<3.0.0",
  "alembic>=1.19.2,<2.0.0",
  "celery>=5.6.3,<6.0.0",
  "redis>=8.1.0,<9.0.0",
  "psycopg[binary]>=3.3.5,<4.0.0",
  "minio>=7.2.20,<8.0.0",
  "httpx>=0.28.1,<0.29.0",
  "httpx2>=2.12.0,<3.0.0",
  "docker>=7.2.0,<8.0.0",
  "openai>=3.8.0,<4.0.0",
  "openai-codex>=0.147.0,<0.148.0",
  "anthropic>=1.4.0,<2.0.0",
  "google-auth[requests]>=2.57.1,<3.0.0",
  "google-genai>=2.22.0,<3.0.0",
  "opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3",
  "cryptography>=50.0.1,<51.0.0",
  "opentelemetry-api>=1.44.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2.0.0",
  "opentelemetry-sdk>=1.44.0,<2.0.0",
  "python-multipart>=0.0.32,<0.1.0",
  "sse-starlette>=3.4.11,<4.0.0",
  "y-py>=0.6.2,<0.7.0",
  "ypy-websocket>=0.12.4,<0.13.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0.0",
  "qdrant-client==1.17.1",
  "olefile>=0.47,<0.48.0",
  "openpyxl>=3.1.5,<4.0.0",
  "numpy>=2.5.3,<3.0.0",
  "pymupdf>=1.28.2,<2.0.0",
  "pdfplumber>=0.11.10,<0.12.0",
  "python-docx>=1.2.0,<2.0.0",
  "langgraph>=1.2.11,<2.0.0",
  "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
]

[dependency-groups]
dev = [
  "import-linter>=2.15,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  "ruff>=0.16.6,<0.17.0",
]

[project.optional-dependencies]
rag-local = [
  "sentence-transformers>=6.0.1,<7.0.0",
  "torch>=2.14.0,<3.0.0",
  "transformers>=5.16.1,<6.0.0",
  "docling>=2.126.0,<3.0.0",
  "easyocr>=1.7.2,<2.0.0",
]
asr-local = [
  "faster-whisper>=1.2.1,<2.0.0",
]
privacy-filter = [
  "opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3",
]

[build-system]
requires = ["hatchling>=1.32.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "slow: high-cost integration or provider smoke tests excluded from the default API suite",
  "external_integration: tests that require shared non-production Redis, MinIO, or OpenSearch infrastructure",
  "migration: native PostgreSQL migration contracts run only for migration or model changes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.metadata]
allow-direct-references = true

# Ruff 0.16 changed its defaults; retain every rule enforced before the upgrade.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_work_hub_api"]
