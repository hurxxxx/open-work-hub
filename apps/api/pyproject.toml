[project]
name = "aidoo-api"
version = "0.1.0"
description = "FastAPI composition root for AIDOO, Doowon's AI work portal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "alembic>=1.16.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "minio>=7.2.0,<8.0.0",
  "openai>=2.0.0,<3.0.0",
  "python-multipart>=0.0.18,<1.0.0"
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<0.29.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.11.0,<0.12.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/aidoo_api"]
