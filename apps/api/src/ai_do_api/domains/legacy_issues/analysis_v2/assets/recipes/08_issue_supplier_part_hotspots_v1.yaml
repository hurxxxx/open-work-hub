{
  "recipe_id": "issue_supplier_part_hotspots",
  "version": 1,
  "title": "협력사·부품 문제 집중도",
  "description": "협력사와 부품번호의 복합 조합별 고유 문제점 건수, 전체 대비 개별·누적 비중, 각 필드의 결측 여부와 공급업체 전체 결측 건수·비중을 구분해 비교한다.",
  "result_shape": "table",
  "counting_unit": "issues",
  "source_views": ["legacy_issue_analysis.issue_records_v1"],
  "sql_template": "SELECT i.supplier, i.part_number, i.supplier IS NULL OR TRIM(i.supplier) = '' AS supplier_missing, i.part_number IS NULL OR TRIM(i.part_number) = '' AS part_number_missing, COUNT(DISTINCT i.issue_id) AS issue_count, SUM(COUNT(DISTINCT i.issue_id)) OVER () AS total_issue_count, ROUND(100.0 * COUNT(DISTINCT i.issue_id) / NULLIF(SUM(COUNT(DISTINCT i.issue_id)) OVER (), 0), 2) AS combination_share, SUM(COUNT(DISTINCT i.issue_id)) FILTER (WHERE i.supplier IS NULL OR TRIM(i.supplier) = '') OVER () AS supplier_missing_issue_count, ROUND(100.0 * SUM(COUNT(DISTINCT i.issue_id)) FILTER (WHERE i.supplier IS NULL OR TRIM(i.supplier) = '') OVER () / NULLIF(SUM(COUNT(DISTINCT i.issue_id)) OVER (), 0), 2) AS supplier_missing_share, SUM(COUNT(DISTINCT i.issue_id)) OVER (ORDER BY COUNT(DISTINCT i.issue_id) DESC, i.supplier, i.part_number ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cumulative_issue_count, ROUND(100.0 * SUM(COUNT(DISTINCT i.issue_id)) OVER (ORDER BY COUNT(DISTINCT i.issue_id) DESC, i.supplier, i.part_number ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) / NULLIF(SUM(COUNT(DISTINCT i.issue_id)) OVER (), 0), 2) AS cumulative_share FROM legacy_issue_analysis.issue_records_v1 AS i WHERE {{filters}} GROUP BY i.supplier, i.part_number ORDER BY issue_count DESC, i.supplier, i.part_number LIMIT :limit",
  "parameters": [
    {"name": "limit", "value_type": "integer", "placement": "bind", "description": "표시할 최대 조합 수", "default": 100, "minimum": 1, "maximum": 500},
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "발생일 시작일", "column": "i.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "발생일 종료일", "column": "i.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "차종 목록", "column": "i.vehicle_model", "operator": "in"},
    {"name": "regions", "value_type": "string_list", "placement": "filter", "description": "권역 목록", "column": "i.region_zone", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "i.module_key", "operator": "in"},
    {"name": "suppliers", "value_type": "string_list", "placement": "filter", "description": "협력사 목록", "column": "i.supplier", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "문제 내용 포함 검색어", "column": "i.search_text", "operator": "contains"}
  ],
  "metrics": [
    {"name": "combination_share", "description": "현재 공급업체·부품 조합의 문제점 수가 전체 문제점 수에서 차지하는 비율", "numerator_column": "issue_count", "denominator_column": "total_issue_count"},
    {"name": "supplier_missing_share", "description": "부품번호와 무관하게 공급업체가 미입력된 전체 문제점의 비율", "numerator_column": "supplier_missing_issue_count", "denominator_column": "total_issue_count"},
    {"name": "cumulative_share", "description": "현재 순위까지 공급업체·부품 조합 문제점 누적 건수가 전체 문제점 수에서 차지하는 비율", "numerator_column": "cumulative_issue_count", "denominator_column": "total_issue_count"}
  ],
  "tags": ["supplier", "part", "hotspot", "ranking"]
}
