{
  "recipe_id": "issue_response_duration",
  "version": 1,
  "title": "과거차 문제 접수 소요일",
  "description": "발생일부터 접수일까지의 측정·제외 건수와 평균·중앙값·최소·최대 소요일을 계산한다. 접수일이 아닌 최종 대책일 등 다른 종료일을 대신하지 않는다.",
  "result_shape": "scalar",
  "counting_unit": "issues",
  "source_views": ["legacy_issue_analysis.issue_records_v1"],
  "sql_template": "SELECT COUNT(DISTINCT i.issue_id) AS total_issue_count, COUNT(DISTINCT CASE WHEN i.occurrence_date IS NOT NULL AND i.received_date IS NOT NULL THEN i.issue_id END) AS measured_issue_count, COUNT(DISTINCT CASE WHEN i.occurrence_date IS NULL OR i.received_date IS NULL THEN i.issue_id END) AS excluded_issue_count, ROUND(AVG(i.received_date - i.occurrence_date), 2) AS average_days, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY i.received_date - i.occurrence_date) AS median_days, MIN(i.received_date - i.occurrence_date) AS minimum_days, MAX(i.received_date - i.occurrence_date) AS maximum_days FROM legacy_issue_analysis.issue_records_v1 AS i WHERE {{filters}}",
  "parameters": [
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "발생일 시작일", "column": "i.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "발생일 종료일", "column": "i.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "차종 목록", "column": "i.vehicle_model", "operator": "in"},
    {"name": "regions", "value_type": "string_list", "placement": "filter", "description": "권역 목록", "column": "i.region_zone", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "i.module_key", "operator": "in"}
  ],
  "tags": ["duration", "lead-time", "average", "response"]
}
