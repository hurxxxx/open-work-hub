{
  "recipe_id": "issue_total",
  "version": 1,
  "title": "과거차 문제점 전체 건수",
  "description": "기간, 차종, 권역, 모듈, 문제 유형 또는 검색어 범위에 해당하는 고유 문제점 건수를 계산한다.",
  "result_shape": "scalar",
  "counting_unit": "issues",
  "source_views": ["legacy_issue_analysis.issue_records_v1"],
  "sql_template": "SELECT COUNT(DISTINCT i.issue_id) AS issue_count FROM legacy_issue_analysis.issue_records_v1 AS i WHERE {{filters}}",
  "parameters": [
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "발생일 시작일", "column": "i.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "발생일 종료일", "column": "i.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "차종 목록", "column": "i.vehicle_model", "operator": "in"},
    {"name": "regions", "value_type": "string_list", "placement": "filter", "description": "권역 목록", "column": "i.region_zone", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "i.module_key", "operator": "in"},
    {"name": "issue_types", "value_type": "string_list", "placement": "filter", "description": "문제 유형 목록", "column": "i.issue_type", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "문제 내용 포함 검색어", "column": "i.search_text", "operator": "contains"}
  ],
  "tags": ["count", "total", "scope", "period", "vehicle", "region"]
}
