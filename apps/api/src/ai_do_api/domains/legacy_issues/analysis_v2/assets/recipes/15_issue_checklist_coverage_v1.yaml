{
  "recipe_id": "issue_checklist_coverage",
  "version": 1,
  "title": "과거차 문제점 체크리스트 반영 범위",
  "description": "선택한 업무 차원별 전체 문제점과 체크리스트 항목에 안정 식별자로 직접 연결된 문제점 수, 미연결 문제점 수, 반영률, 전체 문제점 대비 비중을 비교한다. 반영률 동률은 문제 건수가 많은 그룹을 우선한다.",
  "result_shape": "comparison",
  "counting_unit": "mixed",
  "source_views": ["legacy_issue_analysis.issue_records_v1", "legacy_issue_analysis.vehicle_checklist_items_v1"],
  "sql_template": "SELECT i.{{dimension}} AS dimension_value, COUNT(DISTINCT i.issue_id) AS issue_count, COUNT(DISTINCT CASE WHEN ci.stable_issue_id IS NOT NULL THEN i.issue_id END) AS linked_issue_count, COUNT(DISTINCT CASE WHEN ci.stable_issue_id IS NULL THEN i.issue_id END) AS unlinked_issue_count, ROUND(100.0 * COUNT(DISTINCT CASE WHEN ci.stable_issue_id IS NOT NULL THEN i.issue_id END) / NULLIF(COUNT(DISTINCT i.issue_id), 0), 2) AS coverage_rate, SUM(COUNT(DISTINCT i.issue_id)) OVER () AS total_issue_count, ROUND(100.0 * COUNT(DISTINCT i.issue_id) / NULLIF(SUM(COUNT(DISTINCT i.issue_id)) OVER (), 0), 2) AS issue_share FROM legacy_issue_analysis.issue_records_v1 AS i LEFT JOIN legacy_issue_analysis.vehicle_checklist_items_v1 AS ci ON ci.stable_issue_id = i.stable_issue_id WHERE {{filters}} GROUP BY i.{{dimension}} ORDER BY coverage_rate {{sort_direction}}, issue_count DESC, dimension_value LIMIT :limit",
  "parameters": [
    {"name": "dimension", "value_type": "string", "placement": "identifier", "description": "반영 범위를 비교할 차원", "default": "vehicle_model", "allowed_values": ["vehicle_model", "region_zone", "module_key", "major_category", "middle_category", "occurrence_stage", "occurrence_type", "issue_type", "cause_type", "supplier", "process_name", "severity_grade", "applied"]},
    {"name": "sort_direction", "value_type": "string", "placement": "literal", "description": "반영률 정렬 방향", "default": "DESC", "allowed_values": ["ASC", "DESC"]},
    {"name": "limit", "value_type": "integer", "placement": "bind", "description": "표시할 최대 그룹 수", "default": 100, "minimum": 1, "maximum": 500},
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "문제 발생일 시작일", "column": "i.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "문제 발생일 종료일", "column": "i.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "원본 문제 차종 목록", "column": "i.vehicle_model", "operator": "in"},
    {"name": "regions", "value_type": "string_list", "placement": "filter", "description": "원본 문제 권역 목록", "column": "i.region_zone", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "i.module_key", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "문제 내용 포함 검색어", "column": "i.search_text", "operator": "contains"}
  ],
  "metrics": [
    {"name": "coverage_rate", "description": "각 차원 값 내부의 고유 문제점 수 중 체크리스트 항목에 연결된 문제점 수의 비율", "numerator_column": "linked_issue_count", "denominator_column": "issue_count"},
    {"name": "issue_share", "description": "각 차원 값의 고유 문제점 수가 동일 조회 범위의 전체 문제점 수에서 차지하는 비율", "numerator_column": "issue_count", "denominator_column": "total_issue_count"}
  ],
  "tags": ["coverage", "checklist", "issue", "reflection", "comparison"]
}
