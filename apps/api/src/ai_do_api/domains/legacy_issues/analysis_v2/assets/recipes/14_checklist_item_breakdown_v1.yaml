{
  "recipe_id": "checklist_item_breakdown",
  "version": 1,
  "title": "차량 체크리스트 항목 분포",
  "description": "선택한 업무 차원별 고유 체크리스트 항목 수와 현재 유효 문제점 연결·미연결 항목 수 및 연결률을 집계한다.",
  "result_shape": "table",
  "counting_unit": "checklist_items",
  "source_views": ["legacy_issue_analysis.vehicle_checklist_items_v1", "legacy_issue_analysis.issue_records_v1"],
  "sql_template": "SELECT ci.{{dimension}} AS dimension_value, COUNT(DISTINCT ci.checklist_item_id) AS checklist_item_count, COUNT(DISTINCT CASE WHEN i.stable_issue_id IS NOT NULL THEN ci.checklist_item_id END) AS linked_item_count, COUNT(DISTINCT CASE WHEN i.stable_issue_id IS NULL THEN ci.checklist_item_id END) AS unlinked_item_count, ROUND(100.0 * COUNT(DISTINCT CASE WHEN i.stable_issue_id IS NOT NULL THEN ci.checklist_item_id END) / NULLIF(COUNT(DISTINCT ci.checklist_item_id), 0), 2) AS linkage_rate FROM legacy_issue_analysis.vehicle_checklist_items_v1 AS ci LEFT JOIN legacy_issue_analysis.issue_records_v1 AS i ON i.stable_issue_id = ci.stable_issue_id WHERE {{filters}} GROUP BY ci.{{dimension}} ORDER BY unlinked_item_count DESC, checklist_item_count DESC, dimension_value LIMIT :limit",
  "parameters": [
    {"name": "dimension", "value_type": "string", "placement": "identifier", "description": "체크리스트 항목 집계 차원", "default": "vehicle_model", "allowed_values": ["vehicle_model", "vehicle_code", "module_key", "checklist_status", "major_category", "middle_category", "region_zone", "occurrence_stage", "occurrence_type", "issue_type", "cause_type", "supplier", "process_name", "severity_grade", "applied"]},
    {"name": "limit", "value_type": "integer", "placement": "bind", "description": "표시할 최대 그룹 수", "default": 100, "minimum": 1, "maximum": 500},
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "원본 문제 발생일 시작일", "column": "ci.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "원본 문제 발생일 종료일", "column": "ci.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "체크 대상 차종 목록", "column": "ci.vehicle_model", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "ci.module_key", "operator": "in"},
    {"name": "statuses", "value_type": "string_list", "placement": "filter", "description": "체크리스트 상태 목록", "column": "ci.checklist_status", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "체크 항목 내용 포함 검색어", "column": "ci.search_text", "operator": "contains"}
  ],
  "metrics": [
    {"name": "linkage_rate", "description": "해당 상태 또는 모듈의 고유 체크리스트 항목 중 출처 문제점에 연결된 항목 비율", "numerator_column": "linked_item_count", "denominator_column": "checklist_item_count"}
  ],
  "tags": ["checklist", "item", "distribution", "dimension"]
}
