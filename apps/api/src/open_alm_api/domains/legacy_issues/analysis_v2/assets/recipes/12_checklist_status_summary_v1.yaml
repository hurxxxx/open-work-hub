{
  "recipe_id": "checklist_status_summary",
  "version": 1,
  "title": "차량 체크리스트 완료 현황",
  "description": "차량 체크리스트 문서의 전체·완료·작성중 수와 완료율을 계산한다.",
  "result_shape": "scalar",
  "counting_unit": "checklists",
  "source_views": ["legacy_issue_analysis.vehicle_checklists_v1"],
  "sql_template": "SELECT COUNT(DISTINCT c.checklist_id) AS checklist_count, COUNT(DISTINCT CASE WHEN c.checklist_status = 'completed' THEN c.checklist_id END) AS completed_count, COUNT(DISTINCT CASE WHEN c.checklist_status = 'draft' THEN c.checklist_id END) AS draft_count, ROUND(100.0 * COUNT(DISTINCT CASE WHEN c.checklist_status = 'completed' THEN c.checklist_id END) / NULLIF(COUNT(DISTINCT c.checklist_id), 0), 2) AS completion_rate FROM legacy_issue_analysis.vehicle_checklists_v1 AS c WHERE {{filters}}",
  "parameters": [
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "차종 목록", "column": "c.vehicle_model", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "c.module_key", "operator": "in"},
    {"name": "created_from", "value_type": "date", "placement": "filter", "description": "체크리스트 생성 시작일", "column": "c.created_at", "operator": "gte"},
    {"name": "created_to", "value_type": "date", "placement": "filter", "description": "체크리스트 생성 종료일", "column": "c.created_at", "operator": "lte"}
  ],
  "tags": ["checklist", "completion", "status", "rate"]
}
