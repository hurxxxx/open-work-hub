{
  "recipe_id": "issue_details",
  "version": 1,
  "title": "과거차 문제점 상세 범위",
  "description": "지정한 기간·차종·권역·유형·협력사·부품·단계·공정·원인 범위에 정확히 해당하는 문제점의 검토용 상세 행을 반환한다.",
  "result_shape": "detail",
  "counting_unit": "issues",
  "source_views": ["legacy_issue_analysis.issue_records_v1"],
  "sql_template": "SELECT i.issue_id, i.legacy_issue_number, i.vehicle_model, i.region_zone, i.module_key, i.major_category, i.middle_category, i.occurrence_stage, i.occurrence_date, i.issue_type, i.cause_type, i.supplier, i.part_number, i.process_name, i.severity_grade, i.symptom, i.cause, i.countermeasure, i.applied FROM legacy_issue_analysis.issue_records_v1 AS i WHERE {{filters}} ORDER BY i.occurrence_date DESC, i.issue_id LIMIT :limit",
  "parameters": [
    {"name": "limit", "value_type": "integer", "placement": "bind", "description": "표시할 최대 상세 행 수", "default": 100, "minimum": 1, "maximum": 500},
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "발생일 시작일", "column": "i.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "발생일 종료일", "column": "i.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "차종 목록", "column": "i.vehicle_model", "operator": "in"},
    {"name": "regions", "value_type": "string_list", "placement": "filter", "description": "권역 목록", "column": "i.region_zone", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "i.module_key", "operator": "in"},
    {"name": "issue_types", "value_type": "string_list", "placement": "filter", "description": "문제 유형 목록", "column": "i.issue_type", "operator": "in"},
    {"name": "severity_grades", "value_type": "string_list", "placement": "filter", "description": "중요도 또는 등급 목록", "column": "i.severity_grade", "operator": "in"},
    {"name": "suppliers", "value_type": "string_list", "placement": "filter", "description": "협력사 정확 일치 목록", "column": "i.supplier", "operator": "in"},
    {"name": "supplier_missing", "value_type": "boolean", "placement": "filter", "description": "협력사 미입력 여부", "column": "i.supplier", "operator": "is_null"},
    {"name": "part_numbers", "value_type": "string_list", "placement": "filter", "description": "부품번호 정확 일치 목록", "column": "i.part_number", "operator": "in"},
    {"name": "part_number_missing", "value_type": "boolean", "placement": "filter", "description": "부품번호 미입력 여부", "column": "i.part_number", "operator": "is_null"},
    {"name": "occurrence_stages", "value_type": "string_list", "placement": "filter", "description": "발생 단계 정확 일치 목록", "column": "i.occurrence_stage", "operator": "in"},
    {"name": "process_names", "value_type": "string_list", "placement": "filter", "description": "공정 정확 일치 목록", "column": "i.process_name", "operator": "in"},
    {"name": "cause_types", "value_type": "string_list", "placement": "filter", "description": "원인 유형 정확 일치 목록", "column": "i.cause_type", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "문제 내용 포함 검색어", "column": "i.search_text", "operator": "contains"}
  ],
  "tags": ["detail", "range", "records", "evidence"]
}
