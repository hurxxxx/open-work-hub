{
  "recipe_id": "checklist_item_total",
  "version": 1,
  "title": "차량 체크리스트 항목 수",
  "description": "차종·모듈·체크리스트 상태·문제 범위에 해당하는 고유 체크리스트 항목 수를 계산한다.",
  "result_shape": "scalar",
  "counting_unit": "checklist_items",
  "source_views": ["legacy_issue_analysis.vehicle_checklist_items_v1"],
  "sql_template": "SELECT COUNT(DISTINCT ci.checklist_item_id) AS checklist_item_count FROM legacy_issue_analysis.vehicle_checklist_items_v1 AS ci WHERE {{filters}}",
  "parameters": [
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "원본 문제 발생일 시작일", "column": "ci.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "원본 문제 발생일 종료일", "column": "ci.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "체크 대상 차종 목록", "column": "ci.vehicle_model", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "ci.module_key", "operator": "in"},
    {"name": "statuses", "value_type": "string_list", "placement": "filter", "description": "체크리스트 상태 목록", "column": "ci.checklist_status", "operator": "in"},
    {"name": "issue_types", "value_type": "string_list", "placement": "filter", "description": "원본 문제 유형 목록", "column": "ci.issue_type", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "체크 항목 내용 포함 검색어", "column": "ci.search_text", "operator": "contains"}
  ],
  "tags": ["checklist", "item", "count", "scope"]
}
