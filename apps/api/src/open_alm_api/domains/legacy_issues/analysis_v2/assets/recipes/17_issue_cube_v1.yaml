{
  "recipe_id": "issue_cube",
  "version": 1,
  "title": "과거차 문제점 3차원 교차 집계",
  "description": "세 업무 차원의 조합별 고유 문제점 건수와 첫 번째·두 번째 차원 조합 내부 비중, 전체 범위 비중을 함께 비교한다. 각 행의 세 차원 값은 동일한 문제점 집계 조합이다.",
  "result_shape": "table",
  "counting_unit": "issues",
  "source_views": ["legacy_issue_analysis.issue_records_v1"],
  "sql_template": "SELECT COALESCE(NULLIF(TRIM(i.{{row_dimension}}), ''), '미입력') AS row_value, COALESCE(NULLIF(TRIM(i.{{column_dimension}}), ''), '미입력') AS column_value, COALESCE(NULLIF(TRIM(i.{{detail_dimension}}), ''), '미입력') AS detail_value, COUNT(DISTINCT i.issue_id) AS issue_count, SUM(COUNT(DISTINCT i.issue_id)) OVER (PARTITION BY COALESCE(NULLIF(TRIM(i.{{row_dimension}}), ''), '미입력'), COALESCE(NULLIF(TRIM(i.{{column_dimension}}), ''), '미입력')) AS combination_total_count, ROUND(100.0 * COUNT(DISTINCT i.issue_id) / NULLIF(SUM(COUNT(DISTINCT i.issue_id)) OVER (PARTITION BY COALESCE(NULLIF(TRIM(i.{{row_dimension}}), ''), '미입력'), COALESCE(NULLIF(TRIM(i.{{column_dimension}}), ''), '미입력')), 0), 2) AS detail_share, SUM(COUNT(DISTINCT i.issue_id)) OVER () AS total_issue_count, ROUND(100.0 * COUNT(DISTINCT i.issue_id) / NULLIF(SUM(COUNT(DISTINCT i.issue_id)) OVER (), 0), 2) AS overall_share FROM legacy_issue_analysis.issue_records_v1 AS i WHERE {{filters}} GROUP BY COALESCE(NULLIF(TRIM(i.{{row_dimension}}), ''), '미입력'), COALESCE(NULLIF(TRIM(i.{{column_dimension}}), ''), '미입력'), COALESCE(NULLIF(TRIM(i.{{detail_dimension}}), ''), '미입력') ORDER BY issue_count DESC, row_value, column_value, detail_value LIMIT :limit",
  "parameters": [
    {"name": "row_dimension", "value_type": "string", "placement": "identifier", "description": "첫 번째 집계 차원", "default": "occurrence_stage", "allowed_values": ["vehicle_model", "region_zone", "module_key", "department", "major_category", "middle_category", "occurrence_stage", "occurrence_type", "issue_type", "cause_type", "supplier", "part_number", "process_name", "severity_grade", "applied"]},
    {"name": "column_dimension", "value_type": "string", "placement": "identifier", "description": "두 번째 집계 차원", "default": "process_name", "allowed_values": ["vehicle_model", "region_zone", "module_key", "department", "major_category", "middle_category", "occurrence_stage", "occurrence_type", "issue_type", "cause_type", "supplier", "part_number", "process_name", "severity_grade", "applied"]},
    {"name": "detail_dimension", "value_type": "string", "placement": "identifier", "description": "첫 번째·두 번째 차원 조합 안에서 비교할 세부 차원", "default": "vehicle_model", "allowed_values": ["vehicle_model", "region_zone", "module_key", "department", "major_category", "middle_category", "occurrence_stage", "occurrence_type", "issue_type", "cause_type", "supplier", "part_number", "process_name", "severity_grade", "applied"]},
    {"name": "limit", "value_type": "integer", "placement": "bind", "description": "표시할 최대 조합 수", "default": 200, "minimum": 1, "maximum": 500},
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "발생일 시작일", "column": "i.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "발생일 종료일", "column": "i.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "차종 목록", "column": "i.vehicle_model", "operator": "in"},
    {"name": "regions", "value_type": "string_list", "placement": "filter", "description": "권역 목록", "column": "i.region_zone", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "i.module_key", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "문제 내용 포함 검색어", "column": "i.search_text", "operator": "contains"}
  ],
  "tags": ["cube", "matrix", "crosstab", "comparison", "vehicle", "region", "type"]
}
