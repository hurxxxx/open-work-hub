{
  "recipe_id": "issue_ranked_summary",
  "version": 1,
  "title": "과거차 문제점 상위 그룹 요약",
  "description": "선택한 업무 차원의 상위 N개 그룹별 건수와 누적 건수, 전체 건수, 누적 비중을 한 번에 계산한다.",
  "result_shape": "table",
  "counting_unit": "issues",
  "source_views": ["legacy_issue_analysis.issue_records_v1"],
  "sql_template": "SELECT COALESCE(NULLIF(TRIM(i.{{dimension}}), ''), '미입력') AS dimension_value, COUNT(DISTINCT i.issue_id) AS issue_count, SUM(COUNT(DISTINCT i.issue_id)) OVER () AS total_issue_count, SUM(COUNT(DISTINCT i.issue_id)) OVER (ORDER BY COUNT(DISTINCT i.issue_id) DESC, COALESCE(NULLIF(TRIM(i.{{dimension}}), ''), '미입력') ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cumulative_issue_count, ROUND(100.0 * SUM(COUNT(DISTINCT i.issue_id)) OVER (ORDER BY COUNT(DISTINCT i.issue_id) DESC, COALESCE(NULLIF(TRIM(i.{{dimension}}), ''), '미입력') ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) / NULLIF(SUM(COUNT(DISTINCT i.issue_id)) OVER (), 0), 2) AS cumulative_share FROM legacy_issue_analysis.issue_records_v1 AS i WHERE {{filters}} GROUP BY COALESCE(NULLIF(TRIM(i.{{dimension}}), ''), '미입력') ORDER BY issue_count DESC, dimension_value LIMIT :top_n",
  "parameters": [
    {"name": "dimension", "value_type": "string", "placement": "identifier", "description": "상위 그룹을 계산할 차원", "default": "vehicle_model", "allowed_values": ["vehicle_model", "region_zone", "module_key", "department", "major_category", "middle_category", "occurrence_stage", "occurrence_type", "issue_type", "cause_type", "supplier", "process_name", "severity_grade", "applied"]},
    {"name": "top_n", "value_type": "integer", "placement": "bind", "description": "상위 그룹 수", "default": 10, "minimum": 1, "maximum": 100},
    {"name": "date_from", "value_type": "date", "placement": "filter", "description": "발생일 시작일", "column": "i.occurrence_date", "operator": "gte"},
    {"name": "date_to", "value_type": "date", "placement": "filter", "description": "발생일 종료일", "column": "i.occurrence_date", "operator": "lte"},
    {"name": "vehicle_models", "value_type": "string_list", "placement": "filter", "description": "차종 목록", "column": "i.vehicle_model", "operator": "in"},
    {"name": "regions", "value_type": "string_list", "placement": "filter", "description": "권역 목록", "column": "i.region_zone", "operator": "in"},
    {"name": "module_keys", "value_type": "string_list", "placement": "filter", "description": "모듈 목록", "column": "i.module_key", "operator": "in"},
    {"name": "query_text", "value_type": "string", "placement": "filter", "description": "문제 내용 포함 검색어", "column": "i.search_text", "operator": "contains"}
  ],
  "tags": ["ranking", "share", "summary", "statistics", "dimension"]
}
