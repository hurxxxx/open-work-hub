[project]
name = "owh-codex-console"
version = "0.1.0"
description = "Private, subscription-authenticated Codex development console"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<0.142.0",
  "uvicorn[standard]>=0.52.4,<0.53.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "sqlalchemy>=2.0.52,<3.0.0",
  "alembic>=1.19.2,<2.0.0",
  "psycopg[binary]>=3.3.5,<4.0.0",
  "jsonschema>=4.26.0,<5.0.0",
]

[project.scripts]
codex-console = "codex_console.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10.0.0", "httpx>=0.28.1,<0.29.0", "ruff>=0.16.6,<0.17.0"]

[build-system]
requires = ["hatchling>=1.32.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_console"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
