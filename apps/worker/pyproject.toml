[project]
name = "open-work-hub-worker"
version = "0.1.1"
description = "Celery worker for Open Work Hub."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery>=5.5.0,<6.0.0",
  "redis>=5.2.0,<6.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "minio>=7.2.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<0.29.0",
  "openai>=2.0.0,<3.0.0",
  "cryptography>=44.0.0,<48.0.0",
  "pdfplumber>=0.11.0,<1.0",
  "python-docx>=1.1.0,<2.0",
  "openpyxl>=3.1.0,<4.0",
  "opentelemetry-api>=1.32.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.32.0,<2.0.0",
  "opentelemetry-sdk>=1.32.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.32.0,<2.0.0",
  "qdrant-client==1.17.1",
  "pymupdf>=1.24.0,<2.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.11.0,<0.12.0"
]

[project.optional-dependencies]
rag-local = [
  "sentence-transformers>=3.3.0",
  "torch>=2.4.0",
  "transformers>=4.45.0",
  "docling>=2.0.0",
  "easyocr>=1.7.0",
]
asr-qwen = [
  "transformers>=4.45.0",
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
]
asr-whisper = [
  "faster-whisper>=1.0.0",
  "ctranslate2>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_work_hub_worker"]
