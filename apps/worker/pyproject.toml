[project]
name = "aidoo-worker"
version = "0.1.0"
description = "Celery worker scaffold for AIDOO, Doowon's AI work portal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery>=5.5.0,<6.0.0",
  "redis>=5.2.0,<6.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "minio>=7.2.0",
]

[dependency-groups]
dev = [
  "ruff>=0.11.0,<0.12.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/aidoo_worker"]
