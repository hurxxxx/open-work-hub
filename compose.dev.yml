services:
  postgres:
    image: postgres:18
    container_name: doowon-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidoo_db
      POSTGRES_PASSWORD: aidoo_db
      POSTGRES_DB: doowon_ai_portal
    ports:
      - "${DOOWON_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - doowon-dev-postgres-data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: doowon-dev-redis
    restart: unless-stopped
    ports:
      - "${DOOWON_DEV_REDIS_PORT:-56379}:6379"

  opensearch:
    image: opensearchproject/opensearch:3.3.2
    container_name: doowon-dev-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${DOOWON_DEV_OPENSEARCH_PORT:-59200}:9200"
      - "${DOOWON_DEV_OPENSEARCH_PERF_PORT:-59600}:9600"
    volumes:
      - doowon-dev-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: doowon-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    ports:
      - "${DOOWON_DEV_MINIO_PORT:-59000}:9000"
      - "${DOOWON_DEV_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - doowon-dev-minio-data:/data

  nginx:
    image: nginx:1.27-alpine
    container_name: doowon-dev-nginx
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "${DOOWON_DEV_NGINX_PORT:-4200}:80"
    extra_hosts:
      - "dev-host:host-gateway"
    volumes:
      - ./dist/apps/web:/usr/share/nginx/html:ro
      - ${DOOWON_DEV_NGINX_CONF_PATH:-./ops/dev/nginx.conf}:/etc/nginx/conf.d/default.conf:ro

volumes:
  doowon-dev-postgres-data:
  doowon-dev-opensearch-data:
  doowon-dev-minio-data:
