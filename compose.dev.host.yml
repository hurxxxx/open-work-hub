services:
  postgres:
    image: postgres:18
    container_name: doowon-dev-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: aidoo_db
      POSTGRES_PASSWORD: aidoo_db
      POSTGRES_DB: doowon_ai_portal
    command: ["postgres", "-c", "port=${DOOWON_DEV_POSTGRES_PORT:-55432}"]
    volumes:
      - doowon-dev-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DOOWON_DEV_POSTGRES_PORT:-55432} -U aidoo_db -d doowon_ai_portal"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: doowon-dev-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--port", "${DOOWON_DEV_REDIS_PORT:-56379}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${DOOWON_DEV_REDIS_PORT:-56379}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.3.2
    container_name: doowon-dev-opensearch
    restart: unless-stopped
    network_mode: host
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      http.port: "${DOOWON_DEV_OPENSEARCH_PORT:-59200}"
    volumes:
      - doowon-dev-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${DOOWON_DEV_OPENSEARCH_PORT:-59200} >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: doowon-dev-minio
    restart: unless-stopped
    network_mode: host
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --address :${DOOWON_DEV_MINIO_PORT:-59000} --console-address :${DOOWON_DEV_MINIO_CONSOLE_PORT:-59001}
    volumes:
      - doowon-dev-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${DOOWON_DEV_MINIO_PORT:-59000}/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: doowon-dev-nginx
    restart: unless-stopped
    network_mode: host
    depends_on:
      - redis
    volumes:
      - ./dist/apps/web:/usr/share/nginx/html:ro
      - ${DOOWON_DEV_NGINX_CONF_PATH:-./ops/dev/nginx.conf}:/etc/nginx/conf.d/default.conf:ro

volumes:
  doowon-dev-postgres-data:
  doowon-dev-opensearch-data:
  doowon-dev-minio-data:
