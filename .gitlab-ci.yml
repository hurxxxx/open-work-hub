workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_COMMIT_TAG =~ /^contracts-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
    - when: never

stages:
  - validate
  - review
  - publish

release_validation:
  stage: validate
  image: ai-do-validation:node25-python312-pg18-api-a3e8c22a3552-worker-3149583cef20-node-e7c57b3bacf9-484482bced42
  services:
    - name: redis@sha256:5a77f0f4698389019f828f6387049ce1d5adbea204e56422aa7720dab7034287
      alias: redis
      command:
        - redis-server
        - --save
        - ''
        - --appendonly
        - 'no'
      variables:
        HEALTHCHECK_TCP_PORT: '6379'
    - name: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
      alias: minio
      command:
        - server
        - /data
        - --console-address=:9001
      variables:
        HEALTHCHECK_TCP_PORT: '9000'
        MINIO_ROOT_PASSWORD: ai_do_ci_minio_job_only
        MINIO_ROOT_USER: ai_do_ci_minio
    - name: ai-do-opensearch@sha256:fa1c515ec9913749d8cc7c76c66ac22c377ba9d4ac22132ee9a1749792f12d6d
      alias: opensearch
      variables:
        HEALTHCHECK_TCP_PORT: '9200'
        discovery.type: single-node
        DISABLE_SECURITY_PLUGIN: 'true'
        OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
  tags:
    - ai-do-validation
  inherit:
    default: false
    variables:
      - AI_DO_CI_POSTGRES_DSN
  dependencies: []
  allow_failure: false
  interruptible: true
  resource_group: api-shared-integration
  environment:
    name: ci-validation
    action: access
  variables:
    GIT_DEPTH: "0"
    AI_DO_API_COLLAB_REDIS_URL: redis://redis:6379/0
    AI_DO_API_REALTIME_REDIS_URL: redis://redis:6379/0
    AI_DO_API_TEST_RUN_ID: '$CI_JOB_ID'
    AI_DO_ENV_PROFILE: test
    AI_DO_MINIO_ACCESS_KEY: ai_do_ci_minio
    AI_DO_MINIO_ENDPOINT: http://minio:9000
    AI_DO_MINIO_SECRET_KEY: ai_do_ci_minio_job_only
    AI_DO_OPENSEARCH_URL: http://opensearch:9200
    AI_DO_POSTGRES_DSN: '$AI_DO_CI_POSTGRES_DSN'
    AI_DO_TEST_MINIO_ACCESS_KEY: ai_do_ci_minio
    AI_DO_TEST_MINIO_ENDPOINT: http://minio:9000
    AI_DO_TEST_MINIO_SECRET_KEY: ai_do_ci_minio_job_only
    AI_DO_TEST_NON_PRODUCTION_ACK: non-production
    AI_DO_TEST_OPENSEARCH_URL: http://opensearch:9200
    AI_DO_TEST_POSTGRES_TEMPLATE_DSN: '$AI_DO_CI_POSTGRES_DSN'
    AI_DO_TEST_REDIS_URL: redis://redis:6379/0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
  before_script: []
  script:
    - bash scripts/ci/prepare-validation-runtime.sh
    - cp .env.example .env
    - sed -i 's#^AI_DO_WORKER_BROKER_URL=.*#AI_DO_WORKER_BROKER_URL=memory://#; s#^AI_DO_WORKER_RESULT_BACKEND=.*#AI_DO_WORKER_RESULT_BACKEND=cache+memory://#' .env
    - grep -qx 'AI_DO_WORKER_BROKER_URL=memory://' .env && grep -qx 'AI_DO_WORKER_RESULT_BACKEND=cache+memory://' .env
    - node scripts/check-mr-target-policy.mjs
    - git fetch --no-tags origin "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - node scripts/check-mr-contract-evidence.mjs
    - pnpm check:app-platform-guardrails:artifact
    - pnpm ci:harness
    - uv run --python 3.12 python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
    - uv run --python 3.12 python scripts/tests/test_check_alembic_state.py
    - uv run --python 3.12 python scripts/tests/test_check_python_source_integrity.py
    - uv run --python 3.12 python scripts/check-alembic-state.py --api-root apps/api --static-graph-only
    - uv run --python 3.12 python scripts/check-python-source-integrity.py
    - uv run --python 3.12 python scripts/check-api-i18n-messages.py
    - export PYTHONPATH="$CI_PROJECT_DIR/apps/api/src:$CI_PROJECT_DIR/apps/worker/src"
    - AI_DO_POSTGRES_DSN=postgresql+psycopg://contract:contract@127.0.0.1:1/ai_do_ci_contracts AI_DO_WORKER_QUEUE_GROUP=default pnpm nx run api:ci-contracts --parallel=6 --outputStyle=static --skip-nx-cache
    - $AI_DO_API_IMAGE_VENV/bin/python scripts/check-api-test-budget.py --output api-test-report.json
    - node scripts/run-affected-api-tests.mjs migration
    - node scripts/run-affected-api-tests.mjs standard
    - node scripts/run-affected-api-tests.mjs slow
    - node scripts/run-affected-api-tests.mjs external
    - pnpm ci:app-web-contracts
  after_script:
    - AI_DO_API_CLEANUP_ONLY=1 bash scripts/ci/run-api-pytest.sh external
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    paths:
      - app-platform-guardrails.json
      - api-test-report.json

codex_review:
  stage: review
  tags:
    - codex-local
  inherit:
    default: false
    variables: false
  dependencies: []
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: always
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    - /home/dwdcc/.local/bin/ai-do-codex-review-ci
  after_script: []
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    paths:
      - codex-review.md
      - codex-review-comment.md
      - codex-review-pipeline-context.md
      - codex-review-policy-context.md
      - codex-review-prior-context.md
      - codex-review-progress-start.md
      - codex-review-prompt.md
      - codex-review-run.log

contracts_publish:
  stage: publish
  image: ai-do-validation:node25-python312-pg18-api-a3e8c22a3552-worker-3149583cef20-node-e7c57b3bacf9-484482bced42
  tags:
    - ai-do-validation
  rules:
    - if: '$CI_COMMIT_TAG =~ /^contracts-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - corepack enable
    - corepack prepare pnpm@10.33.0 --activate
    - pnpm install --frozen-lockfile
    - node scripts/check-contracts-publish-tag.mjs
    - pnpm build:contracts
    - export NPM_CONFIG_USERCONFIG="$(mktemp)"
    - trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
    - printf '@ai-do:registry=%s/projects/%s/packages/npm/\n' "$CI_API_V4_URL" "$CI_PROJECT_ID" > "$NPM_CONFIG_USERCONFIG"
    - printf '//%s/projects/%s/packages/npm/:_authToken=%s\n' "${CI_API_V4_URL#*://}" "$CI_PROJECT_ID" "$CI_JOB_TOKEN" >> "$NPM_CONFIG_USERCONFIG"
    - cd packages/contracts
    - pnpm publish --no-git-checks

contracts_desktop_compatibility:
  stage: publish
  needs:
    - contracts_publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^contracts-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  trigger:
    project: dwdcc/ai-do-desktop
    branch: main
    strategy: depend
  variables:
    AI_DO_CONTRACTS_VERSION: '$CI_COMMIT_TAG'
