name: doowon

services:
  postgres:
    image: postgres:18
    container_name: doowon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_do_db
      POSTGRES_PASSWORD: ai_do_db
      POSTGRES_DB: ai_do_portal_dev
    ports:
      - "${DOOWON_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_do_db -d ai_do_portal_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: doowon-redis
    restart: unless-stopped
    ports:
      - "${DOOWON_REDIS_PORT:-56379}:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.3.2
    container_name: doowon-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${DOOWON_OPENSEARCH_PORT:-59200}:9200"
      - "${DOOWON_OPENSEARCH_PERF_PORT:-59600}:9600"
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: doowon-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    ports:
      - "${DOOWON_MINIO_PORT:-59000}:9000"
      - "${DOOWON_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doowon-qdrant
    restart: unless-stopped
    ports:
      - "${DOOWON_QDRANT_PORT:-6333}:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6333/collections || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
