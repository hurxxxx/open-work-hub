name: ai-do-local

services:
  redis:
    image: redis:7
    container_name: ai-do-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${AI_DO_LOCAL_REDIS_PORT:-56381}:6379"
    volumes:
      - ai-do-local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    build:
      context: .
      dockerfile: ops/opensearch/Dockerfile
    image: ai-do-opensearch:3.3.2-nori
    container_name: ai-do-local-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${AI_DO_LOCAL_OPENSEARCH_PORT:-59220}:9200"
      - "127.0.0.1:${AI_DO_LOCAL_OPENSEARCH_PERF_PORT:-59620}:9600"
    volumes:
      - ai-do-local-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ai-do-local-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AI_DO_LOCAL_MINIO_ROOT_USER:-ai_do_local_minio}
      MINIO_ROOT_PASSWORD: ${AI_DO_LOCAL_MINIO_ROOT_PASSWORD:-ai_do_local_minio}
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:${AI_DO_LOCAL_MINIO_PORT:-59020}:9000"
      - "127.0.0.1:${AI_DO_LOCAL_MINIO_CONSOLE_PORT:-59021}:9001"
    volumes:
      - ai-do-local-minio-data:/data

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ai-do-local-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${AI_DO_LOCAL_QDRANT_API_KEY:-ai_do_local_qdrant}
    ports:
      - "127.0.0.1:${AI_DO_LOCAL_QDRANT_PORT:-16335}:6333"
      - "127.0.0.1:${AI_DO_LOCAL_QDRANT_GRPC_PORT:-16336}:6334"
    volumes:
      - ai-do-local-qdrant-data:/qdrant/storage

volumes:
  ai-do-local-redis-data:
    name: ai-do-local-redis-data
  ai-do-local-opensearch-data:
    name: ai-do-local-opensearch-data
  ai-do-local-minio-data:
    name: ai-do-local-minio-data
  ai-do-local-qdrant-data:
    name: ai-do-local-qdrant-data
