services:
  postgres:
    image: postgres:18
    container_name: doowon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_do_db
      POSTGRES_PASSWORD: ai_do_db
      POSTGRES_DB: ai_do_portal
    ports:
      - "5432:5432"
    volumes:
      - doowon-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_do_db -d ai_do_portal"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  doowon-postgres-data:
